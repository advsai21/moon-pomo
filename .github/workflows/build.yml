name: build-apk
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android scaffolding (keep my files)
        run: |
          cp lib/main.dart "$RUNNER_TEMP/main.dart"
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml"
          flutter create --platforms=android --org com.moonpomo --project-name moonpomo .
          cp "$RUNNER_TEMP/main.dart" lib/main.dart
          cp "$RUNNER_TEMP/pubspec.yaml" pubspec.yaml
      - name: Patch Android manifest + gradle
        run: python3 ci/patch_android.py
      - name: Signing key (from repo secret KEYSTORE_BASE64)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using secret keystore"
          elif [ -f ci/debug.keystore ]; then
            cp ci/debug.keystore ~/.android/debug.keystore
            echo "Using committed keystore (add the KEYSTORE_BASE64 secret!)"
          fi
      - run: flutter pub get
      - name: App icon
        continue-on-error: true
        run: dart run flutter_launcher_icons
      - name: Build APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            flutter build apk --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          else
            flutter build apk --release --build-number="$GITHUB_RUN_NUMBER"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "MoonPomo-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: moonpomo-apk
          path: MoonPomo-*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MoonPomo-*.apk
          generate_release_notes: true
