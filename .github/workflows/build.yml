name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android scaffolding (keep my files)
        run: |
          cp lib/main.dart "$RUNNER_TEMP/main.dart"
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml"
          flutter create --platforms=android --project-name moonpomo .
          cp "$RUNNER_TEMP/main.dart" lib/main.dart
          cp "$RUNNER_TEMP/pubspec.yaml" pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: moonpomo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
